services:

  postgres:
    image: postgres:16
    container_name: razorrecon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: razorrecon
      POSTGRES_USER: razorrecon
      POSTGRES_PASSWORD: razorrecon

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorrecon -d razorrecon"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile

    container_name: razorrecon-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg2://razorrecon:razorrecon@postgres:5432/razorrecon
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: razorrecon-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data: