services:
  postgres:
    image: postgres:16
    container_name: razorrecon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: razorrecon
      POSTGRES_USER: razorrecon
      POSTGRES_PASSWORD: razorrecon

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorrecon -d razorrecon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: